version: 1

# Target-local mission/persona overrides for *this* repo when it is being usertested.
#
# This keeps repo-specific missions out of the global built-in catalog.

missions_dirs:
  - .usertest/missions
personas_dirs:
  - .usertest/personas

defaults:
  persona_id: repo_adoption_gatekeeper
  mission_id: self_end_to_end_run_single_target

meta:
  note: Repo-specific usertest missions/personas for agentic-usertest-monorepo.
