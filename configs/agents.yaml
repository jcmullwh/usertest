# How to invoke each agent CLI in headless mode.
#
# This file is intentionally minimal. Treat these as defaults; the runner also has CLI flags.

agents:
  codex:
    binary: codex
    subcommand: exec
    # Latest recommended Codex model for complex coding and agentic workflows.
    default_model: gpt-5.5
    supports_json_schema: false
    raw_events_format: jsonl
    # Optional: extra packages to install into the docker sandbox_cli image when
    # --exec-backend docker is used with the sandbox_cli context.
    # These are repo-specific and should stay minimal (agent CLI + its direct runtime deps).
    sandbox_cli_install:
      apt: [nodejs]
      pip: []
      npm_global: ["@openai/codex"]
    # Default Codex config overrides passed via `codex exec -c key=value`.
    # Headless repo runs use `codex exec --ignore-user-config`, so these are the
    # repo-owned defaults instead of relying on interactive user config.
    config_overrides:
      - "model_reasoning_effort=high"
    # Optional delegation capability contract. Leave unset until a local CLI probe or
    # adapter documentation confirms the installed CLI's delegation/subagent tool names.
    # delegation_tools: []
    args:
      json_events: ["--json"]
      last_message: ["--output-last-message"]
      cd: ["--cd"]
      sandbox: ["--sandbox"]

  claude:
    binary: claude
    # Pin to Anthropic's current Sonnet model instead of relying on Claude Code's alias resolution.
    default_model: claude-sonnet-5
    supports_json_schema: true
    raw_events_format: jsonl
    output_format: stream-json
    notes: "Implemented (headless `claude -p`)."
    # Delegation capability contract confirmed against Claude Code 2.1.205.
    # Guard the version so a changed CLI marks delegation unavailable instead of
    # silently assuming the tool name is still valid.
    delegation:
      tools: ["Agent"]
      confirmed_cli_versions: ["2.1.205 (Claude Code)"]
    sandbox_cli_install:
      # Claude Code is commonly installed via npm; keep deps minimal.
      apt: [nodejs]
      pip: []
      npm_global: ["@anthropic-ai/claude-code"]

  gemini:
    binary: gemini
    # Gemini CLI's recommended Auto routing default for current Gemini model families.
    default_model: auto
    supports_json_schema: false
    raw_events_format: jsonl
    output_format: stream-json
    notes: "Implemented (headless `gemini --output-format stream-json`)."
    # Delegation capability contract confirmed against Gemini CLI 0.50.0.
    # Gemini exposes subagent dispatch through the unified invoke_agent tool.
    # Guard the version so a changed CLI marks delegation unavailable instead of
    # silently assuming the tool name is still valid.
    delegation:
      tools: ["invoke_agent"]
      confirmed_cli_versions: ["0.50.0"]
    sandbox_cli_install:
      apt: [nodejs]
      pip: []
      npm_global: ["@google/gemini-cli"]
