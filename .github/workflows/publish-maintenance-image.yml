name: Publish maintenance image

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-maintenance-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maintenance image prep deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Prepare maintenance image context
        run: |
          python tools/maintenance_image/prepare_context.py \
            --repo-root . \
            --output-dir .tmp/maintenance_image_context \
            --metadata-out .tmp/maintenance_image_context.json

      - name: Compute maintenance image metadata
        id: meta
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import yaml

          sys.path.insert(0, str(Path("packages/sandbox_runner/src").resolve()))
          from sandbox_runner.image_hash import compute_image_hash

          config = yaml.safe_load(Path("configs/maintenance_docker.yaml").read_text(encoding="utf-8"))
          maintenance = config["maintenance_docker"]
          published_repo = maintenance["published_image_repo"]
          context = Path(".tmp/maintenance_image_context").resolve()
          dockerfile = context / "Dockerfile"
          image_hash = compute_image_hash(context_dir=context, dockerfile=dockerfile)
          short = image_hash[:16]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"published_repo={published_repo}\n")
              fh.write(f"image_hash={image_hash}\n")
              fh.write(f"image_tag={short}\n")
          PY

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build maintenance image
        run: |
          docker build --progress=plain \
            -t "${{ steps.meta.outputs.published_repo }}:${{ steps.meta.outputs.image_tag }}" \
            -f .tmp/maintenance_image_context/Dockerfile \
            .tmp/maintenance_image_context

      - name: Push fingerprint tag
        run: docker push "${{ steps.meta.outputs.published_repo }}:${{ steps.meta.outputs.image_tag }}"

      - name: Push moving tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            docker tag "${{ steps.meta.outputs.published_repo }}:${{ steps.meta.outputs.image_tag }}" "${{ steps.meta.outputs.published_repo }}:dev-latest"
            docker push "${{ steps.meta.outputs.published_repo }}:dev-latest"
          fi
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag "${{ steps.meta.outputs.published_repo }}:${{ steps.meta.outputs.image_tag }}" "${{ steps.meta.outputs.published_repo }}:main-latest"
            docker tag "${{ steps.meta.outputs.published_repo }}:${{ steps.meta.outputs.image_tag }}" "${{ steps.meta.outputs.published_repo }}:latest"
            docker push "${{ steps.meta.outputs.published_repo }}:main-latest"
            docker push "${{ steps.meta.outputs.published_repo }}:latest"
          fi
