[project]
name = "token_monitoring"
version = "0.2.0"
description = "Metadata-only token inefficiency monitoring for usertest runs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["pdm-backend>=2.0.0"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.monorepo]
status = "incubator"

[tool.pdm.scripts]
smoke = "python -m pytest -q tests/test_codex_sessions.py tests/test_run_analysis.py"
test = "python -m pytest -q"
lint = "python -m ruff check ."

[tool.pdm.dev-dependencies]
dev = [
  "deptry>=0.20.0",
  "mypy>=1.8.0",
  "pytest>=8.0.0",
  "ruff>=0.14.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
]
ignore = ["UP017"]
